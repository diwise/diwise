services:
  proxy:
    image: "registry.access.redhat.com/ubi9/nginx-124"
    command:
      - nginx
      - -g
      - daemon off;
    restart: always
    volumes:
      - ./configs/proxy/nginx.conf:/etc/nginx/nginx.conf
      - ./configs/proxy/openssl/server.crt:/etc/ssl/server.crt
      - ./configs/proxy/openssl/server.key:/etc/ssl/server.key
    ports:
      - "8443:443"
      - "8444:444"
    networks:
      default:
        aliases:
          - iam.diwise.local

  diwise-web:
    image: "ghcr.io/diwise/diwise-web@sha256:2ce4eb5c15bca1a8b06cea82ce137951617b4ac82f3a275375f63d311cc73f12"
    restart: always
    depends_on:
      iot-device-mgmt:
        condition: service_healthy
    environment:
      APP_ROOT: "https://diwise.local:8443"
      CONTENT_SECURITY_POLICY: "report"
      CONTROL_PORT: "8000"
      DEV_MGMT_URL: "http://iot-device-mgmt:8080/api/v0/devices"
      MEASUREMENTS_URL: "http://iot-events:8080/api/v0/measurements"
      THINGS_URL: "http://iot-things:8080/api/v0/things"
      MSG_FWD_ENDPOINT: "http://iot-agent:8080/api/v0/messages"
      OAUTH2_REALM_URL: "https://iam.diwise.local:8444/realms/diwise-local"
      OAUTH2_REALM_INSECURE: "true"
      OAUTH2_CLIENT_ID: "diwise-frontend-par"
      OAUTH2_CLIENT_SECRET: "615241704865544572616B61474E494B65504861574E7449744943655269654E"
    ports:
      - "8000"
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  iot-agent:
    image: "ghcr.io/diwise/iot-agent@sha256:8f2a57b5fb186eabd44be7b29235be3ffb6b4669d61d60a04cb8ce1461d70d77"
    restart: always
    depends_on:
      iot-device-mgmt:
        condition: service_healthy
    environment:
      MQTT_DISABLED: "true"
      RABBITMQ_HOST: "rabbitmq"
      DEV_MGMT_URL: "http://iot-device-mgmt:8080"
      DEVMGMT_CLIENT_DEBUG: "true"
      MSG_FWD_ENDPOINT: "http://iot-agent:8080/api/v0/messages"
      OAUTH2_TOKEN_URL: "https://iam.diwise.local:8444/realms/diwise-local/protocol/openid-connect/token"
      OAUTH2_REALM_INSECURE: "true"
      OAUTH2_CLIENT_ID: "diwise-devmgmt-api"
      OAUTH2_CLIENT_SECRET: "615241704865544572616B61474E494B65504861574E7449744943655269654E"
      APPSERVER_FACADE: "chirpstack"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_HOST: "timescale"
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: "orion"
      POSTGRES_SSLMODE: "disable"
    ports:
      - "8000"
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  iot-core:
    image: "ghcr.io/diwise/iot-core@sha256:76925aeba97fd61fc76fd372d6b97ff88480c1f3fdbc3eec0a9fc91f2bcb27ed"
    restart: always
    depends_on:
      iot-device-mgmt:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: "rabbitmq"
      DEV_MGMT_URL: "http://iot-device-mgmt:8080"
      DEVMGMT_CLIENT_DEBUG: "true"
      MEASUREMENTS_URL: "https://iot-device-mgmt:8080/measurements"
      OAUTH2_TOKEN_URL: "https://iam.diwise.local:8444/realms/diwise-local/protocol/openid-connect/token"
      OAUTH2_REALM_INSECURE: "true"
      OAUTH2_CLIENT_ID: "diwise-devmgmt-api"
      OAUTH2_CLIENT_SECRET: "615241704865544572616B61474E494B65504861574E7449744943655269654E"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_HOST: "timescale"
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: "orion"
      POSTGRES_SSLMODE: "disable"
    volumes:
      - ./configs/diwise/functions.csv:/opt/diwise/config/functions.csv
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s


  iot-device-mgmt:
    image: "ghcr.io/diwise/iot-device-mgmt@sha256:be50d4c95525a3a1277562f74705e110eea51fbc0fce40646f0b5a0fbd8b5956"
    restart: always
    depends_on:
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      timescale:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: "rabbitmq"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_HOST: "timescale"
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: "orion"
      POSTGRES_SSLMODE: "disable"
    volumes:
      - ./configs/diwise/data/devices.csv:/opt/diwise/config/devices.csv
      - ./configs/diwise/devmgmt-auth.rego:/opt/diwise/config/authz.rego
      - ./configs/diwise/data/config.yaml:/opt/diwise/config/config.yaml
    ports:
      - "8000"
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  iot-transform-fiware:
    image: "ghcr.io/diwise/iot-transform-fiware@sha256:b5f30293f2a4baab762b34e7cdca9e6a3153c70c9586ce1b9c4c407add4d4ec6"
    restart: always
    depends_on:
      iot-device-mgmt:
        condition: service_healthy
    environment:
      NGSI_CB_URL: "http://context-broker:8080"
      RABBITMQ_HOST: "rabbitmq"
    ports:
      - "8000"
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  iot-events:
    image: "ghcr.io/diwise/iot-events@sha256:270efe723c0cf593bd06921aafc2fc5c707c4eef48a26328e533862b4bc4fed7"
    restart: always
    depends_on:
      iot-device-mgmt:
        condition: service_healthy
    environment:
      OAUTH2_TOKEN_URL: "https://iam.diwise.local:8444/realms/diwise-local/protocol/openid-connect/token"
      OAUTH2_REALM_INSECURE: "true"
      OAUTH2_CLIENT_ID: "diwise-devmgmt-api"
      OAUTH2_CLIENT_SECRET: "615241704865544572616B61474E494B65504861574E7449744943655269654E"
      RABBITMQ_HOST: "rabbitmq"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_HOST: "timescale"
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: "orion"
      POSTGRES_SSLMODE: "disable"
    volumes:
      - ./configs/diwise/devmgmt-auth.rego:/opt/diwise/config/authz.rego
      - ./configs/diwise/iotevents-cloudevents.yaml:/opt/diwise/config/cloudevents.yaml
    ports:
      - "8080"
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  iot-things:
    image: "ghcr.io/diwise/iot-things@sha256:c80e064e64d7b8147d21196005ace5b660450f26ecd4e8ffc0a61c611ee3c211"
    restart: always
    depends_on:
      iot-device-mgmt:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: "rabbitmq"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      POSTGRES_HOST: "timescale"
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: "orion"
      POSTGRES_SSLMODE: "disable"
    volumes:
      - ./configs/diwise/iot-things-auth.rego:/opt/diwise/config/authz.rego
      - ./configs/diwise/things.csv:/opt/diwise/config/things.csv
      - ./configs/diwise/config.yaml:/opt/diwise/config/config.yaml
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  context-broker:
    image: "ghcr.io/diwise/context-broker@sha256:bf2b36b1f631e81a3d025cff741825ecbcb90cb6b4cfca894e11c54dce15f8ab"
    restart: always
    environment:
      CONTEXT_BROKER_CLIENT_DEBUG: "true"
    depends_on:
      keycloak:
        condition: service_healthy
      orion-ld:
        condition: service_healthy
      mintaka:
        condition: service_healthy
    volumes:
      - ./configs/diwise/context-broker.yaml:/opt/diwise/config/default.yaml
      - ./configs/diwise/context-broker-auth.rego:/opt/diwise/config/authz.rego
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  orion-ld:
    image: "quay.io/fiware/orion-ld@sha256:d1c2b50ba47046c2dd0bcd786970469e21d6998b08ad09b56da8fb17cd267ef6"
    restart: always
    command: ["-experimental", "-logLevel", "DEBUG"]
    environment:
      ORIONLD_MONGO_HOST: "mongodb"
      ORIONLD_MONGO_USER: "admin"
      ORIONLD_MONGO_PASSWORD: "password"
      ORIONLD_TROE: "TRUE"
      ORIONLD_TROE_USER: "postgres"
      ORIONLD_TROE_PWD: "password"
      ORIONLD_TROE_HOST: "timescale"
      ORIONLD_LOG_FOR_HUMANS: "TRUE"
      ORIONLD_DISABLE_FILE_LOG: "TRUE"
    depends_on:
      mongodb:
        condition: service_healthy
      timescale:
        condition: service_healthy
    ports:
      - "1026"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1026/ngsi-ld/v1/types"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mintaka:
    image: fiware/mintaka:0.7.0
    restart: always
    depends_on:
      orion-ld:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
      DATASOURCES_DEFAULT_HOST: "timescale"
      DATASOURCES_DEFAULT_USERNAME: "postgres"
      DATASOURCES_DEFAULT_PASSWORD: "password"
      DATASOURCES_DEFAULT_DATABASE: "orion"
      BASEPATH: "/ngsi-ld/v1"
    #    volumes:
    #      - './configs/diwise/mintaka-logging.xml:/app/resources/logback.xml'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    ports:
      - "8080"

  timescale:
    image: timescale/timescaledb-ha:pg17-ts2.18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    ports:
      - "5432"

  mongodb:
    image: mongo:5
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongo",
          "--port",
          "27017",
          "-u",
          "admin",
          "-p",
          "password",
          "--eval",
          '"db.adminCommand(''ping'')"',
        ]
      interval: 5s
      timeout: 1s
      retries: 12
      start_period: 10s
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "password"
    ports:
      - "27017"
    command: --nojournal
    volumes:
      - mongo-db:/data

  rabbitmq:
    image: "bitnamilegacy/rabbitmq:3.11"
    environment:
      RABBITMQ_DEFAULT_USER: "user"
      RABBITMQ_DEFAULT_PASS: "bitnami"
    ports:
      - "4369"
      - "5672"
      - "25672"
      - "15672"
      - "15692"
    volumes:
      - "rabbitmq_data:/bitnami"
      - "./configs/rabbitmq/enabled_plugins:/opt/bitnami/rabbitmq/etc/rabbitmq/enabled_plugins"
      - "./configs/rabbitmq/rabbitmq.conf:/opt/bitnami/rabbitmq/etc/rabbitmq/rabbitmq.conf"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - "start-dev"
      - "--hostname=https://iam.diwise.local:8444"
      - "--proxy-headers=xforwarded"
      - "--health-enabled=true"
      - "-Dkeycloak.migration.action=import"
      - "-Dkeycloak.migration.provider=singleFile"
      - "-Dkeycloak.migration.strategy=OVERWRITE_EXISTING"
      - "-Dkeycloak.migration.file=/application-realm.json"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
    ports:
      - "8080"
      - "9000"
    volumes:
      - ./configs/keycloak/realm.json:/application-realm.json
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/keycloak/9000;echo -e 'GET /health/ready HTTP/1.1\r\nHost: keycloak:9000\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.2
    command: ["--config", "/usr/share/grafana/custom.ini"]
    environment:
      GF_SERVER_DOMAIN: diwise.local
      GF_SERVER_ROOT_URL: https://diwise.local:8443/grafana/
      GF_SERVER_SERVER_FROM_SUBPATH: "true"
      GF_SECURITY_ADMIN_USER: diwise
      GF_SECURITY_ADMIN_PASSWORD: diwise
    volumes:
      - ./configs/grafana/custom.ini:/usr/share/grafana/custom.ini
      - grafana-data:/var/lib/grafana
    ports:
      - "3000"
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  rabbitmq_data:
    driver: local
  grafana-data:
  mongo-db: ~
